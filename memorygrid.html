<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mil ke Khelo!">
<meta name="theme-color" content="#1B0F3D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Memory Grid — Mil ke Khelo!</title>
<meta name="description" content="Memory Grid: memorise the lit blocks, tap them from memory and build a streak. Play solo against your best score, or head-to-head with a friend on one device. Free, in English or Hindi.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://milkekhelo.com/memorygrid.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://milkekhelo.com/memorygrid.html">
<meta property="og:title" content="Memory Grid — Mil ke Khelo!">
<meta property="og:description" content="Memorise the lit blocks, tap them from memory and build a streak. Solo or 2 players.">
<meta property="og:image" content="https://milkekhelo.com/images/home/card_memory_grid_en.webp">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --screen-bg:#1B0F3D;
  --surface:rgba(255,255,255,.14);
  --border-default:rgba(255,255,255,.28);
  --text-primary:#FFFFFF;
  --text-on-light:#1B2340;
  --text-muted:#BABABA;
  --mg-gold:#FBBF24;
  --title-accent:#C3B0F5;
  --tile-empty:rgba(0,0,0,.35);
  --tile-lit:#8B6CF0;
  --tile-wrong:#FF7A45;
  --tile-number:#1B2340;
  --p1-border:#FFC53D; --p1-swatch:#FBBF24;
  --p2-border:#FF7A45; --p2-swatch:#EF4444;
  --cta-top:#FFE08A; --cta-bottom:#C97F00; --cta-shadow:#7A4B00; --cta-pressed:#E1AB3E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--screen-bg);font-family:'Baloo 2',sans-serif;overscroll-behavior:none;}
body{overflow:hidden;}
/* Mobile layout only — even on a wide desktop window the game stays a
   phone-width column, centered, never stretching to fill the screen. */
#stack{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:var(--screen-bg);}
.view{position:absolute;inset:0;display:none;flex-direction:column;}
.view.active{display:flex;}

/* ── Header (shared GameHeader) ── */
.hdr{display:flex;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));gap:8px;flex-shrink:0;}
.hdr-left{display:flex;align-items:center;gap:8px;min-width:72px;}
.icon-btn{width:32px;height:32px;border-radius:12px;background:var(--surface);border:1px solid var(--border-default);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text-primary);
  font-size:16px;font-weight:800;touch-action:manipulation;user-select:none;}
.icon-btn svg{width:16px;height:16px;}
.icon-btn.muted{color:var(--text-muted);}
.icon-img{display:block;width:18px;height:18px;flex-shrink:0;pointer-events:none;}
.hdr-title{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--text-primary);}
.lang-toggle{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border-default);border-radius:12px;overflow:hidden;padding:4px;height:32px;flex-shrink:0;}
.lang-btn{padding:0 10px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;background:transparent;border:none;font-family:'Baloo 2',sans-serif;height:100%;display:flex;align-items:center;border-radius:8px;}
.lang-btn.active{background:var(--mg-gold);color:var(--text-on-light);}

/* ── Landing (GameLandingBody) ── */
#landing-body{flex:1;overflow:auto;padding:0 24px;}
#landing-inner{min-height:100%;display:flex;align-items:center;justify-content:center;}
#landing-stack{padding:24px 0;display:flex;flex-direction:column;align-items:center;width:100%;max-width:312px;margin:0 auto;}
.mg-hero{width:180px;height:180px;object-fit:contain;display:block;}
.mg-title-h1{font-size:28px;font-weight:800;line-height:1.15;color:#fff;text-align:center;margin-top:16px;}
.mg-subtitle{font-size:15px;font-weight:500;line-height:1.4;color:var(--text-muted);text-align:center;margin-top:6px;}
.mg-cards{width:100%;margin-top:48px;display:flex;flex-direction:column;}
.mg-card-wrap{width:100%;height:85px;position:relative;}
.mg-card-wrap + .mg-card-wrap{margin-top:19px;}
.mg-heartbeat{width:100%;height:100%;animation:mgHeartbeat 2.6s ease-in-out infinite;animation-play-state:paused;}
@keyframes mgHeartbeat{
  0%{transform:scale(1);}
  7%{transform:scale(1.03);}
  15%{transform:scale(1);}
  21%{transform:scale(1.02);}
  33%{transform:scale(1);}
  100%{transform:scale(1);}
}
.mg-card{position:relative;width:100%;height:100%;cursor:pointer;touch-action:manipulation;user-select:none;}
.mg-card-shadow{position:absolute;left:0;right:0;bottom:0;height:80px;border-radius:16px;}
.mg-card-face{position:absolute;left:0;right:0;top:0;height:80px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:top .09s ease-out;overflow:hidden;padding:0 14px;text-align:center;}
.mg-card.pressed .mg-card-face{top:5px;}
.mg-card.pressed .mg-card-face::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.18);}
.mg-card-title{font-size:28px;font-weight:800;line-height:1.15;color:#fff;white-space:nowrap;
  -webkit-text-stroke:3.5px rgba(0,0,0,.45);paint-order:stroke fill;}
.mg-card-sub{font-size:15px;font-weight:500;line-height:1.4;color:#fff;white-space:normal;max-width:100%;}

/* ── Score / status row (game view) ── */
.mg-score-row{display:flex;padding:8px 12px;gap:12px;flex-shrink:0;}
.mg-stat-box{flex:1;background:var(--surface);border:2px solid var(--border-default);border-radius:16px;padding:10px 16px;text-align:center;}
.mg-stat-value{font-size:15px;font-weight:800;color:var(--text-primary);line-height:17px;display:block;}
.mg-stat-label{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.66px;line-height:12px;text-transform:uppercase;display:block;margin-top:2px;}
.mg-chip{flex:1;background:var(--surface);border-radius:16px;padding:10px 16px;display:flex;align-items:center;gap:12px;
  border:2px solid transparent;transition:opacity .25s;}
.mg-chip-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;border:3px solid rgba(255,255,255,.85);}
.mg-chip-name{font-size:12px;font-weight:700;line-height:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mg-chip-score-row{display:flex;align-items:baseline;gap:4px;margin-top:2px;}
.mg-chip-score{font-size:18px;font-weight:700;line-height:20px;color:#fff;}
.mg-chip-unit{font-size:11px;font-weight:500;line-height:12px;color:var(--text-muted);}

/* ── Play area ── */
#mg-play-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow:hidden;position:relative;}
#mg-grid-col{display:flex;flex-direction:column;align-items:center;}
#mg-grid{display:grid;gap:8px;}
.mg-tile{position:relative;cursor:pointer;touch-action:manipulation;}
.mg-tile-inner{width:100%;height:100%;border-radius:12px;background:var(--tile-empty);
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease-in-out;}
.mg-tile-num{font-weight:800;color:var(--tile-number);line-height:1.05;}
#mg-status{height:20px;margin-top:24px;font-size:16px;font-weight:800;text-align:center;}

/* ── Footer (lives + hint) ── */
.mg-footer{padding:0 16px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));flex-shrink:0;height:52px;
  display:flex;align-items:center;}
.mg-footer-row{display:flex;align-items:center;width:100%;height:36px;}
#mg-lives-canvas{display:block;}
.mg-spacer{flex:1;}
.mg-hint-btn{height:36px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border-default);
  display:flex;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation;user-select:none;transition:opacity .15s;}
.mg-hint-btn.disabled{opacity:.4;pointer-events:none;}
.mg-hint-label{font-size:14px;font-weight:700;color:#fff;}
.mg-hint-count{font-size:12px;font-weight:800;color:var(--text-on-light);background:#FFC53D;border-radius:999px;padding:1px 8px;}

/* ── Countdown ── */
#mg-countdown{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.mg-countdown-label{font-size:20px;font-weight:700;color:rgba(255,255,255,.54);}
.mg-countdown-num{font-size:104px;font-weight:800;line-height:1;color:var(--title-accent);margin-top:2px;
  animation:mgCountPop .4s cubic-bezier(.2,2,.4,1);}
@keyframes mgCountPop{from{transform:scale(.6);}to{transform:scale(1);}}

/* ── Flash (praise text) ── */
.mg-flash{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:50;opacity:0;transition:opacity .25s;}
.mg-flash.show{opacity:1;}
.mg-flash-text{font-size:44px;font-weight:800;line-height:1.1;color:#fff;-webkit-text-stroke:7px #2A1A5E;paint-order:stroke fill;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));text-align:center;animation:mgFlashPop .35s cubic-bezier(.17,.89,.32,1.49);}
@keyframes mgFlashPop{from{transform:scale(.5);}to{transform:scale(1);}}

/* ── New best banner (same treatment as Blocks Jodo's New Best Score) ── */
#newbest{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:51;pointer-events:none;opacity:0;}
#newbest.show{animation:newbestPop 1.7s cubic-bezier(.2,1,.3,1) forwards;}
@keyframes newbestPop{
  0%{opacity:0;transform:scale(.4) rotate(-2deg);}
  20%{opacity:1;transform:scale(1.05) rotate(-4deg);}
  28%{opacity:1;transform:scale(1) rotate(-2deg);}
  82%{opacity:1;transform:scale(1) rotate(-2deg) translateY(0);}
  100%{opacity:0;transform:scale(1.06) rotate(-2deg) translateY(-18px);}
}
.nb-glow{position:absolute;width:280px;height:280px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle, rgba(255,197,61,.55) 0%, rgba(255,138,0,.22) 42%, rgba(255,138,0,0) 72%);
  opacity:0;}
#newbest.show .nb-glow{animation:nbGlow 1.7s cubic-bezier(.2,1,.3,1) forwards;}
@keyframes nbGlow{
  0%{opacity:0;transform:scale(.35);}
  20%{opacity:1;transform:scale(1.2);}
  32%{opacity:.85;transform:scale(1);}
  78%{opacity:.6;}
  100%{opacity:0;transform:scale(1.08);}
}
.nb-trophy{font-size:38px;margin-bottom:2px;opacity:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
#newbest.show .nb-trophy{animation:nbTrophy 1.7s cubic-bezier(.2,1,.3,1) forwards;}
@keyframes nbTrophy{
  0%{opacity:0;transform:translateY(8px) scale(.5) rotate(-18deg);}
  24%{opacity:1;transform:translateY(0) scale(1.2) rotate(10deg);}
  34%{opacity:1;transform:translateY(0) scale(1) rotate(0deg);}
  82%{opacity:1;transform:translateY(0) scale(1) rotate(0deg);}
  100%{opacity:0;transform:translateY(-16px) scale(1.05) rotate(0deg);}
}
.nb-spark{position:absolute;color:#FFE9A8;font-size:14px;opacity:0;line-height:1;
  text-shadow:0 0 6px rgba(255,197,61,.9), 0 0 2px #fff;}
#newbest.show .nb-spark{animation:nbSpark 1.7s ease-out forwards;}
.nb-spark:nth-of-type(1){top:22%;left:20%;font-size:15px;animation-delay:.05s;}
.nb-spark:nth-of-type(2){top:16%;right:18%;font-size:11px;animation-delay:.14s;}
.nb-spark:nth-of-type(3){bottom:28%;left:14%;font-size:13px;animation-delay:.22s;}
.nb-spark:nth-of-type(4){bottom:24%;right:12%;font-size:17px;animation-delay:.08s;}
.nb-spark:nth-of-type(5){top:42%;left:6%;font-size:10px;animation-delay:.3s;}
.nb-spark:nth-of-type(6){top:38%;right:6%;font-size:12px;animation-delay:.18s;}
@keyframes nbSpark{
  0%{opacity:0;transform:scale(.2) rotate(0deg);}
  26%{opacity:1;transform:scale(1.3) rotate(80deg);}
  42%{opacity:.9;transform:scale(.9) rotate(130deg);}
  72%{opacity:.6;}
  100%{opacity:0;transform:scale(.55) rotate(190deg);}
}
.glossy3d{display:grid;justify-items:center;position:relative;}
.glossy3d > span{grid-area:1/1;font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.1;white-space:nowrap;}
.glossy3d .g3d-outline{color:transparent;-webkit-text-stroke:3px #4A2205;
  filter:drop-shadow(0 4px 2px #B45309) drop-shadow(0 8px 14px rgba(0,0,0,.6));}
.glossy3d .g3d-fill{background:linear-gradient(180deg,#FFF9DD 0%, #FFC53D 42%, #FF8A00 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.glossy3d .g3d-shimmer{background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,.95) 49%, rgba(255,255,255,.95) 53%, transparent 68%);
  background-size:260% 100%;background-position:-130% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;mix-blend-mode:overlay;}
#newbest.show .g3d-shimmer{animation:nbShimmer 1.7s ease-out forwards;}
@keyframes nbShimmer{
  0%,18%{background-position:-130% 0;}
  48%{background-position:130% 0;}
  100%{background-position:130% 0;}
}
#newbest .nb-title{font-size:34px;}
#newbest .nb-value{font-size:62px;margin-top:2px;}

/* ── Game over ── */
#gameover{position:absolute;inset:0;background:rgba(20,10,48,.95);display:none;align-items:center;justify-content:center;z-index:60;overflow:auto;}
#gameover.show{display:flex;animation:fadeScale .42s ease-out;}
@keyframes fadeScale{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
.go-inner{text-align:center;padding:32px;max-width:340px;}
.go-emoji{font-size:70px;}
.go-title{font-size:28px;font-weight:800;color:#fff;margin-top:12px;}
.go-sub{font-size:14px;font-weight:600;color:var(--text-muted);margin-top:8px;line-height:1.4;}
.go-stat{margin-top:20px;background:rgba(255,255,255,.06);border-radius:20px;border:2px solid transparent;padding:16px 28px;}
.go-score{font-size:54px;font-weight:800;color:var(--mg-gold);}
.go-score-label{font-size:12px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.7);text-transform:uppercase;margin-top:2px;}
.go-best{font-size:13px;font-weight:700;color:rgba(255,255,255,.54);margin-top:6px;}
.go-duel-row{display:flex;align-items:center;justify-content:center;margin-top:20px;}
.go-duel-box{padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.06);border:2px solid transparent;min-width:84px;}
.go-duel-box.winner{background:rgba(251,191,36,.15);border-color:var(--mg-gold);}
.go-duel-name{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);}
.go-duel-score{font-size:26px;font-weight:800;color:#fff;margin-top:4px;}
.go-duel-vs{font-size:14px;font-weight:600;color:rgba(255,255,255,.38);padding:0 14px;}
.go-btn-wrap{margin-top:26px;}
.go-back{margin-top:16px;font-size:15px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer;display:inline-block;touch-action:manipulation;}

/* ── Chunky button ── */
.chunky-btn{height:48px;min-width:180px;padding:0 24px;border-radius:16px;border:none;cursor:pointer;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;color:var(--text-on-light);
  background:linear-gradient(180deg,var(--cta-top) 0%,var(--cta-bottom) 100%);
  box-shadow:0 4px 0 var(--cta-shadow);margin-bottom:4px;transition:none;touch-action:manipulation;}
.chunky-btn:active{margin-top:4px;margin-bottom:0;box-shadow:none;background:var(--cta-pressed);}

/* ── How to play sheet ── */
#how-overlay{position:fixed;inset:0;z-index:300;background:rgba(5,10,20,.6);display:none;align-items:flex-end;justify-content:center;}
#how-overlay.open{display:flex;}
#how-sheet{width:100%;max-width:480px;background:linear-gradient(135deg,#1E1040 0%,#0D2040 100%);
  border-radius:28px 28px 0 0;padding:16px 24px 32px;padding-bottom:max(32px,env(safe-area-inset-bottom));
  max-height:80vh;overflow:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.34,1,.4,1);}
#how-overlay.open #how-sheet{transform:translateY(0);}
.how-grabber{width:40px;height:4px;background:rgba(255,255,255,.24);border-radius:2px;margin:0 auto 20px;}
.how-title{font-size:22px;font-weight:800;color:var(--mg-gold);}
.how-step{display:flex;align-items:flex-start;gap:14px;margin-top:16px;}
.how-step:first-of-type{margin-top:20px;}
.how-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:13px;font-weight:800;color:var(--text-on-light);background:linear-gradient(135deg,#8B6CF0,#6A4FC2);}
.how-step-title{font-size:15px;font-weight:800;color:#fff;}
.how-step-body{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-top:2px;line-height:1.4;}
.how-goal{margin-top:20px;background:rgba(139,108,240,.1);border:1px solid rgba(139,108,240,.25);border-radius:16px;padding:16px;}
.how-goal-title{font-size:15px;font-weight:800;color:#fff;}
.how-goal-text{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-top:6px;line-height:1.4;}

/* ── Confetti ── */
#confetti-canvas{position:absolute;inset:0;z-index:55;pointer-events:none;}
</style>
</head>
<body>
<div id="stack">

  <!-- ══════════════ LANDING VIEW ══════════════ -->
  <div class="view active" id="landing-view">
    <div class="hdr">
      <div class="hdr-left">
        <button class="icon-btn" id="lv-back" aria-label="Back"><img class="icon-img" src="images/icons/icon-back.webp" alt=""></button>
        <button class="icon-btn" id="lv-sound" aria-label="Sound"><img class="icon-img" src="images/icons/icon-sound.webp" alt=""></button>
        <button class="icon-btn" id="lv-help" aria-label="How to play"><img class="icon-img" src="images/icons/icon-help.webp" alt=""></button>
      </div>
      <div class="hdr-title"></div>
      <div class="lang-toggle">
        <button class="lang-btn active" id="lv-lb-en">EN</button>
        <button class="lang-btn" id="lv-lb-hi">हिं</button>
      </div>
    </div>
    <div id="landing-body">
      <div id="landing-inner">
        <div id="landing-stack">
          <img class="mg-hero" id="mg-hero-img" src="images/memory_grid/hero_en.webp" alt="Memory Grid">
          <div class="mg-cards" id="mg-cards">
            <div class="mg-card-wrap"><div class="mg-heartbeat" id="hb-0"><div class="mg-card" id="card-easy" data-level="easy">
              <div class="mg-card-shadow" style="background:#114C33;"></div>
              <div class="mg-card-face" style="background:linear-gradient(180deg,#6EE0AC,#1E8A5C);--card-shadow:#114C33;">
                <div class="mg-card-title" id="card-easy-title"></div>
                <div class="mg-card-sub" id="card-easy-sub"></div>
              </div>
            </div></div></div>
            <div class="mg-card-wrap"><div class="mg-heartbeat" id="hb-1"><div class="mg-card" id="card-hard" data-level="hard">
              <div class="mg-card-shadow" style="background:#5D1010;"></div>
              <div class="mg-card-face" style="background:linear-gradient(180deg,#EF7676,#A81D1D);--card-shadow:#5D1010;">
                <div class="mg-card-title" id="card-hard-title"></div>
                <div class="mg-card-sub" id="card-hard-sub"></div>
              </div>
            </div></div></div>
            <div class="mg-card-wrap"><div class="mg-heartbeat" id="hb-2"><div class="mg-card" id="card-duel" data-level="">
              <div class="mg-card-shadow" style="background:#7A4B00;"></div>
              <div class="mg-card-face" style="background:linear-gradient(180deg,#FFE08A,#C97F00);--card-shadow:#7A4B00;">
                <div class="mg-card-title" id="card-duel-title"></div>
                <div class="mg-card-sub" id="card-duel-sub"></div>
              </div>
            </div></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="mg-footer" style="height:50px;"></div>
  </div>

  <!-- ══════════════ GAME VIEW ══════════════ -->
  <div class="view" id="game-view">
    <div class="hdr">

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function shuffle(arr){
  for (var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function pickTarget(size, dots){
  var all = []; for (var i=0;i<size*size;i++) all.push(i);
  shuffle(all);
  var picked = all.slice(0, dots);
  picked.sort(function(a,b){ return a-b; });

}

function setPref(k, v){ try { localStorage.setItem(PREF_KEYS[k], v?'1':'0'); } catch(e){} }

var AUDIO_CACHE = {};

  if (!AUDIO_CACHE[name]) AUDIO_CACHE[name] = new Audio('audio/sfx/'+name+'.mp3');
  return AUDIO_CACHE[name];
}
function playSfx(name){

    el.volume = 1;
    el.play().catch(function(){});
  } catch(e){}
}
function vibrate(pattern){

}

/* ─────────────────────────── Lives hearts (shared look w/ Blocks Jodo) ─────────────────────────── */
var DPR = Math.max(1, window.devicePixelRatio || 1);
function setupCanvas(canvasEl, w, h){
  canvasEl.width = Math.round(w*DPR);
  canvasEl.height = Math.round(h*DPR);
  canvasEl.style.width = w+'px';
  canvasEl.style.height = h+'px';
  var ctx = canvasEl.getContext('2d');
  ctx.setTransform(DPR,0,0,DPR,0,0);
  return ctx;
}
var $livesCanvas = document.getElementById('mg-lives-canvas');
var prevLives = MAX_LIVES, losingIdx = -1, loseStart = null;
function renderLivesCanvas(lives){
  if (lives < prevLives){ losingIdx = clamp(lives, 0, MAX_LIVES-1); loseStart = performance.now(); }
  else if (lives > prevLives){ losingIdx = -1; loseStart = null; }
  prevLives = lives;
  drawHearts(lives);
}
function heartPath(w, h){
  var p = new Path2D();
  p.moveTo(w*0.5, h*0.98);
  p.bezierCurveTo(w*0.36,h*0.86, 0,h*0.62, 0,h*0.32);
  p.bezierCurveTo(0,h*0.12, w*0.15,0, w*0.29,0);
  p.bezierCurveTo(w*0.40,0, w*0.47,h*0.07, w*0.5,h*0.17);
  p.bezierCurveTo(w*0.53,h*0.07, w*0.60,0, w*0.71,0);
  p.bezierCurveTo(w*0.85,0, w,h*0.12, w,h*0.32);
  p.bezierCurveTo(w,h*0.62, w*0.64,h*0.86, w*0.5,h*0.98);
  p.closePath();
  return p;
}
function drawHeart(ctx, x, y, w, hTotal, full){
  var ledge = 3, h = hTotal - ledge;
  ctx.save();
  ctx.translate(x, y);
  var path = heartPath(w, h);
  if (!full){
    ctx.save(); ctx.translate(0, ledge);
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill(path);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill(path);
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.stroke(path);
    ctx.restore();
    return;
  }
  ctx.save(); ctx.translate(0, ledge);
  ctx.fillStyle = '#6E0A0F'; ctx.fill(path);
  ctx.restore();
  var grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, '#FF5A52'); grad.addColorStop(1, '#D9141E');
  ctx.fillStyle = grad; ctx.fill(path);
  ctx.save();
  ctx.translate(w*0.27, h*0.27); ctx.rotate(-0.6);
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(0,0, w*0.11, w*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawHearts(lives){
  var size = 26, gap = 10;
  var totalW = MAX_LIVES*size + (MAX_LIVES-1)*gap;
  var h = size*0.9+3;
  var ctx = setupCanvas($livesCanvas, totalW, h);
  ctx.clearRect(0,0,totalW,h);
  var v = 0, animating = false;
  if (loseStart!==null){
    v = clamp((performance.now()-loseStart)/650, 0, 1);
    animating = v < 1;
    if (animating) requestAnimationFrame(function(){ drawHearts(lives); });
  }
  for (var i=0;i<MAX_LIVES;i++){
    var x = i*(size+gap);
    var full = i < lives;
    var losing = i===losingIdx && animating;
    var drawFull = full || (losing && v<0.5);
    ctx.save();
    if (losing){
      var hop = Math.sin(Math.PI*Math.min(1, v*1.6));
      var wobble = Math.sin(v*Math.PI*8)*(1-v)*0.25;
      var cx = x+size/2, cy = h/2;
      ctx.translate(cx, cy);
      ctx.translate(0, -hop*size*0.35);
      ctx.rotate(wobble);
      ctx.scale(1+0.2*hop, 1+0.2*hop);
      ctx.translate(-size/2, -h/2);
      drawHeart(ctx, 0, 0, size, h, drawFull);
    } else {
      drawHeart(ctx, x, 0, size, h, drawFull);
    }
    ctx.restore();
  }
}

/* ─────────────────────────── Confetti ─────────────────────────── */
var $confettiCanvas = document.getElementById('confetti-canvas');
var confettiCtx = $confettiCanvas.getContext('2d');
var confettiParticles = [], confettiStart = null, CONFETTI_DUR = 1600;
function setupConfettiCanvas(){
  var r = $stack.getBoundingClientRect();
  setupCanvas($confettiCanvas, r.width, r.height);
}
function fireConfetti(){
  confettiParticles = [];
  for (var i=0;i<90;i++){
    confettiParticles.push({
      startX: Math.random(), startY: -Math.random()*0.5,
      w: 6+Math.random()*6, h: 9+Math.random()*8,
      color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      vx: -1.2+Math.random()*2.4, vy: 2.6+Math.random()*3.2,
      rot0: Math.random()*360, vr: -7+Math.random()*14
    });
  }
  confettiStart = performance.now();
}
function paintConfetti(){
  var r = $stack.getBoundingClientRect();
  confettiCtx.clearRect(0,0,r.width,r.height);
  if (confettiStart===null) return;
  var elapsed = performance.now()-confettiStart;
  if (elapsed > CONFETTI_DUR){ confettiStart = null; return; }
  var remaining = CONFETTI_DUR - elapsed;
  var fadeAlpha = remaining < 400 ? clamp(remaining/400,0,1) : 1;
  var t = elapsed/16;
  for (var i=0;i<confettiParticles.length;i++){
    var p = confettiParticles[i];
    var x = p.startX*r.width + p.vx*t;
    var y = p.startY*r.height + p.vy*t;
    if (y > r.height+20) continue;
    var rot = (p.rot0 + p.vr*t) * Math.PI/180;
    confettiCtx.save();
    confettiCtx.globalAlpha = fadeAlpha;
    confettiCtx.translate(x,y);
    confettiCtx.rotate(rot);
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    confettiCtx.restore();
  }
}
function confettiTick(){
  try { paintConfetti(); } catch(e){ if (window.console) console.error('confetti error', e); }
  requestAnimationFrame(confettiTick);
}

var countdownTimer = null, flashTimer = null, newBestTimer = null;
var tileEls = [];

function bestKey(){ return 'mg-best-'+level; }
function loadBest(){ try { best = parseInt(localStorage.getItem(bestKey())||'0',10)||0; } catch(e){ best=0; } }
function saveBest(){ try { localStorage.setItem(bestKey(), String(best)); } catch(e){} }

function after(ms, fn){ return setTimeout(fn, ms); }

/* ─────────────────────────── Countdown ─────────────────────────── */
var countdownTick = 3;
function runCountdown(onDone){
  $mgCountdown.style.display = 'flex';
  $mgGridCol.style.visibility = 'hidden';
  countdownTick = 3;
  Fx.countdown();
  renderCountdown();
  countdownTimer = setInterval(function(){
    var next = countdownTick - 1;
    if (next <= 0){
      clearInterval(countdownTimer);
      Fx.goSignal();
      $mgCountdown.style.display = 'none';
      $mgGridCol.style.visibility = 'visible';
      onDone();
    } else {
      Fx.countdown();
      countdownTick = next;
      renderCountdown();
    }
  }, 700);
}
function renderCountdown(){
  $mgCountdownLabel.textContent = tr().memorizeIn;
  $mgCountdownNum.textContent = String(countdownTick);
  $mgCountdownNum.style.animation = 'none';
  void $mgCountdownNum.offsetWidth;
  $mgCountdownNum.style.animation = '';
}

/* ─────────────────────────── Grid build/render ─────────────────────────── */
function layoutGrid(){
  var areaRect = $mgPlayArea.getBoundingClientRect();
  var below = 24 + 20;
  var margin = 16;
  var gridSide = clamp(areaRect.width - 64, 160, clamp(areaRect.height - below - 2*margin, 160, 2000));
  var gap = 8;
  var tile = (gridSide - gap*(gridSize-1)) / gridSize;
  $mgGrid.style.width = gridSide+'px';
  $mgGrid.style.height = gridSide+'px';
  $mgGrid.style.gridTemplateColumns = 'repeat('+gridSize+', 1fr)';
  $mgGrid.style.gridTemplateRows = 'repeat('+gridSize+', 1fr)';
  var radius = 12 * clamp(tile/108, 0.6, 1.0);
  for (var i=0;i<tileEls.length;i++){
    tileEls[i].querySelector('.mg-tile-inner').style.borderRadius = radius+'px';
  }
  tileRadius = radius;
  tileFontBase = 32 * tile/108;
}
var tileRadius = 12, tileFontBase = 32;
var tileFaceUp = [];
function buildGrid(){
  $mgGrid.innerHTML = '';
  tileEls = [];
  tileFaceUp = [];
  var total = gridSize*gridSize;
  for (var i=0;i<total;i++){
    var tile = document.createElement('div');
    tile.className = 'mg-tile';
    var inner = document.createElement('div');
    inner.className = 'mg-tile-inner';
    var label = document.createElement('div');
    label.className = 'mg-tile-num';
    inner.appendChild(label);
    tile.appendChild(inner);
    (function(idx){
      tile.addEventListener('click', function(){ onTileTap(idx); });
    })(i);
    $mgGrid.appendChild(tile);
    tileEls.push(tile);
    tileFaceUp.push(false);
  }
  layoutGrid();
}
/* Mirrors the app's own _FlipTile: a single face rotated to a near-right
   angle, content swapped at the midpoint, then rotated back — rather than
   two stacked backface-hidden faces (which some browsers, including
   headless test browsers, render both sides of at once instead of hiding
   the far side — safer to never depend on that). */
function setTile(i, faceUp, bg, labelText, fontPx){
  var tile = tileEls[i];
  var inner = tile.querySelector('.mg-tile-inner');
  var label = inner.querySelector('.mg-tile-num');
  var changed = tileFaceUp[i] !== faceUp;
  if (!changed){
    inner.style.background = bg;
    label.textContent = labelText;
    if (fontPx) label.style.fontSize = fontPx+'px';
    return;
  }
  tileFaceUp[i] = faceUp;
  inner.style.transform = 'rotateY(90deg) scale(1.06)';
  setTimeout(function(){
    inner.style.background = bg;
    label.textContent = labelText;
    if (fontPx) label.style.fontSize = fontPx+'px';
    inner.style.transform = 'rotateY(0deg) scale(1)';
  }, 150);
}
function renderGrid(){
  try {
    for (var i=0;i<tileEls.length;i++){
      var isFound = found.indexOf(i) !== -1;
      var isWrong = wrongIndex === i;
      var isHint = !!(hintRevealed[i] && !isFound);
      var isLit = phase === 'showing' && target.indexOf(i) !== -1;
      var faceUp = isWrong || isFound || isLit || isHint;

      var bg = 'var(--tile-empty)';
      var labelText = '';
      var fontPx = null;
      if (faceUp){
        bg = 'var(--tile-lit)';
        if (isWrong){
          bg = 'var(--tile-wrong)';
        } else if (isFound){
          labelText = String(found.indexOf(i)+1);
          fontPx = Math.max(11, tileFontBase);
        } else if (isHint){
          bg = 'rgba(139,108,240,.59)';
        }
      }
      setTile(i, faceUp, bg, labelText, fontPx);

      var locked = phase !== 'play';
      tileEls[i].style.cursor = locked ? 'default' : 'pointer';
    }
  } catch(e){ if (window.console) console.error('Memory Grid render error:', e); }
}

function updateDuelChips(){
  var p1 = document.getElementById('chip-p1'), p2 = document.getElementById('chip-p2');
  var s1 = document.getElementById('chip-p1-score'), s2 = document.getElementById('chip-p2-score');

  p2.style.opacity = activePlayer === 1 ? '1' : '.7';
}

/* ─────────────────────────── Status text/color ─────────────────────────── */
function statusText(){
  var t = tr();
  switch (statusKind){
    case 'memorise': return t.memorise;
    case 'tapProgress': return t.tap(statusA, statusB);
    case 'outLives': return t.outLives;
    case 'lifeLeft': return t.lifeLeft;
    case 'livesLeft': return t.livesLeft(statusA);
    case 'turn': return current===0 ? t.p1turn : t.p2turn;
    case 'hereThey': return t.hereThey;
  }
  return '';
}
function statusColor(){
  switch (statusKind){
    case 'memorise': case 'hereThey': return 'var(--title-accent)';
    case 'turn': return current===0 ? 'var(--p1-border)' : 'var(--p2-border)';
    case 'outLives': case 'lifeLeft': return 'var(--tile-wrong)';
    default: return 'var(--text-muted)';
  }
}
function renderStatusLine(){
  $mgStatus.textContent = statusText();
  $mgStatus.style.color = statusColor();
}

/* ─────────────────────────── Hint button ─────────────────────────── */
function renderHintButton(){
  var showCount = !isDuel;
  var enabled = isDuel ? phase==='play' : (hints>0 && phase==='play');
  $mgHintBtn.classList.toggle('disabled', !enabled);
  $mgHintLabel.textContent = tr().hint;
  $mgHintCount.style.display = showCount ? 'inline-block' : 'none';
  if (showCount) $mgHintCount.textContent = String(hints);
}

/* ─────────────────────────── Solo flow ─────────────────────────── */
function soloNewRound(){
  found = []; hintRevealed = {}; wrongIndex = null;
  target = pickTarget(gridSize, dotCount);
  phase = 'showing';
  statusKind = 'memorise';
  renderGrid(); renderStatusLine(); renderHintButton();
  var baseMs = REVEAL_MS[level];
  var revealMs = firstEasyRound ? baseMs*2 : baseMs;
  firstEasyRound = false;
  after(revealMs + FLIP_MS, function(){
    phase = 'play';
    statusKind = 'tapProgress'; statusA = 0; statusB = target.length;
    renderGrid(); renderStatusLine(); renderHintButton();
  });
}
function onTileTap(i){
  if (phase !== 'play') return;
  if (isDuel) duelTap(i); else soloTap(i);
}
function soloTap(i){
  if (found.indexOf(i) !== -1) return;
  if (target.indexOf(i) !== -1){
    Fx.correct();
    found.push(i);
    statusA = found.length;
    renderGrid(); renderStatusLine();
    if (found.length === target.length) soloRoundWon();
  } else {
    Fx.wrong();
    wrongIndex = i;
    renderGrid();
    soloLoseLife();
  }
}
function soloRoundWon(){
  phase = 'idle'; streak++;
  renderGrid(); updateSoloStats();
  var celebrate = false;
  if (streak > best){
    celebrate = best > 0 && !bestAnnounced;
    best = streak; saveBest();
  }
  if (celebrate) bestAnnounced = true;
  updateSoloStats();
  if (celebrate){
    celebrateNewBest(tr().newBestStreak, streak);
  } else {
    Fx.roundWin();
    flash(tr().praise[Math.floor(Math.random()*tr().praise.length)]);
  }
  after(1500, function(){
    found = []; hintRevealed = {}; wrongIndex = null;
    renderGrid();
    after(FLIP_MS+250, function(){ soloNewRound(); });
  });
}
function soloLoseLife(){
  lives--;
  renderLivesCanvas(lives);
  if (lives <= 0){
    phase = 'over';
    target.forEach(function(i){ if (found.indexOf(i)===-1) hintRevealed[i]=true; });
    statusKind = 'outLives';
    renderGrid(); renderStatusLine();
    after(1000, function(){
      Fx.lose();
      openGameOver();
    });
  } else {
    statusKind = lives===1 ? 'lifeLeft' : 'livesLeft';
    statusA = lives;
    renderStatusLine();
    after(600, function(){
      wrongIndex = null;
      statusKind = 'tapProgress'; statusA = found.length; statusB = target.length;
      renderGrid(); renderStatusLine();
    });
  }
}
function soloHint(){
  if (hints <= 0 || phase !== 'play') return;
  Fx.hint();
  hints--;
  target.forEach(function(i){ if (found.indexOf(i)===-1) hintRevealed[i]=true; });
  renderGrid(); renderHintButton();
  after(DUEL_HINT_MS, function(){
    hintRevealed = {};
    renderGrid();
  });
}

/* ─────────────────────────── Duel flow ─────────────────────────── */
function duelStartRound(){
  found = []; hintRevealed = {}; wrongIndex = null;
  target = pickTarget(gridSize, dotCount);
  phase = 'showing'; activePlayer = -1; statusKind = 'memorise';
  renderGrid(); renderStatusLine(); updateDuelChips(); renderHintButton();
  after(DUEL_SHOW_MS + FLIP_MS, function(){
    phase = 'play'; current = 0; activePlayer = 0; statusKind = 'turn';
    renderGrid(); renderStatusLine(); updateDuelChips(); renderHintButton();
  });
}
function duelTap(i){
  if (found.indexOf(i) !== -1) return;
  phase = 'resolving';
  if (target.indexOf(i) !== -1){
    Fx.correct();
    found.push(i);
    duelScores[current]++;
    renderGrid(); updateDuelChips();
    if (found.length === target.length){
      after(700, duelEnd);
    } else {
      after(650, switchTurn);
    }
  } else {
    Fx.wrong();
    wrongIndex = i;
    renderGrid();
    after(650, function(){
      wrongIndex = null;
      renderGrid();
      switchTurn();
    });
  }
}
function switchTurn(){
  Fx.turn();
  current = 1-current; phase = 'play'; activePlayer = current; statusKind = 'turn';
  renderGrid(); renderStatusLine(); updateDuelChips(); renderHintButton();
}
function duelHint(){
  if (phase !== 'play') return;
  Fx.hint();
  var savedCurrent = current;
  target.forEach(function(i){ if (found.indexOf(i)===-1) hintRevealed[i]=true; });
  statusKind = 'hereThey'; phase = 'resolving';
  renderGrid(); renderStatusLine(); renderHintButton();
  after(DUEL_HINT_MS, function(){
    hintRevealed = {};
    current = savedCurrent; activePlayer = savedCurrent; phase = 'play'; statusKind = 'turn';
    renderGrid(); renderStatusLine(); updateDuelChips(); renderHintButton();
  });
}
function duelEnd(){
  phase = 'over';
  fireConfetti();
  Fx.win();
  openGameOver();
}

/* ─────────────────────────── Game over ─────────────────────────── */
function openGameOver(){
  showGameOver = true;
  renderGameOver();
  $gameover.classList.add('show');
}
function renderGameOver(){
  var t = tr();
  document.getElementById('go-solo-stat').style.display = isDuel ? 'none' : 'block';
  document.getElementById('go-duel-stat').style.display = isDuel ? 'flex' : 'none';
  if (isDuel){
    var tie = duelScores[0] === duelScores[1];
    document.getElementById('go-emoji').textContent = tie ? '🤝' : '🏆';
    document.getElementById('go-title').textContent = tie ? t.tie : t.wins(duelScores[0] > duelScores[1] ? 1 : 2);
    document.getElementById('go-sub').textContent = tie ? t.tieSub : t.winSub;
    document.getElementById('go-p1-name').textContent = t.p1;
    document.getElementById('go-p2-name').textContent = t.p2;
    document.getElementById('go-p1-score').textContent = String(duelScores[0]);
    document.getElementById('go-p2-score').textContent = String(duelScores[1]);
    var p1win = duelScores[0] >= duelScores[1] && duelScores[0] !== duelScores[1];
    var p2win = duelScores[1] > duelScores[0];
    document.getElementById('go-p1-box').classList.toggle('winner', p1win);
    document.getElementById('go-p2-box').classList.toggle('winner', p2win);
  } else {
    document.getElementById('go-emoji').textContent = '🧠';
    document.getElementById('go-title').textContent = t.gameOver;
    document.getElementById('go-sub').textContent = streak===0 ? t.betterLuck : t.reachedStreak(streak);
    document.getElementById('go-streak').textContent = String(streak);
    document.getElementById('go-streak-label').textContent = t.finalStreak.toUpperCase();
    var bestEl = document.getElementById('go-best');
    if (best > 0){ bestEl.style.display='block'; bestEl.textContent = t.bestStreak(best); } else { bestEl.style.display='none'; }
  }
  document.getElementById('btn-play-again').textContent = t.playAgain;
  document.getElementById('btn-back-home').textContent = t.backHome;
}
function playAgain(){
  if (!isDuel) streak = 0;
  bestAnnounced = false;
  lives = MAX_LIVES; hints = MAX_HINTS;
  duelScores = [0,0];
  found = []; hintRevealed = {}; wrongIndex = null;
  if (!isDuel) firstEasyRound = level === 'easy';
  showGameOver = false;
  $gameover.classList.remove('show');
  renderLivesCanvas(lives);
  renderStatusRow();
  renderHintButton();
  runCountdown(function(){
    if (isDuel) duelStartRound(); else soloNewRound();
  });
}

/* ─────────────────────────── How to play ─────────────────────────── */
function openHow(duel){
  var t = tr();
  document.getElementById('how-title').textContent = t.howTitle;
  var steps = duel ? t.howStepsDuel : t.howStepsSolo;
  var wrap = document.getElementById('how-steps');
  wrap.innerHTML = '';
  steps.forEach(function(step, i){
    var row = document.createElement('div');
    row.className = 'how-step';
    var num = document.createElement('div');
    num.className = 'how-num';
    num.textContent = String(i+1);
    var textWrap = document.createElement('div');
    var t1 = document.createElement('div'); t1.className='how-step-title'; t1.textContent = step[0];
    var t2 = document.createElement('div'); t2.className='how-step-body'; t2.textContent = step[1];
    textWrap.appendChild(t1); textWrap.appendChild(t2);
    row.appendChild(num); row.appendChild(textWrap);
    wrap.appendChild(row);
  });
  document.getElementById('how-goal-wrap').style.display = 'block';
  document.getElementById('how-goal-title').textContent = t.goalTitle;
  document.getElementById('how-goal-text').textContent = t.goalText;
  document.getElementById('how-overlay').classList.add('open');
}

function startGame(chosenLevel){
  isDuel = chosenLevel === null;
  level = chosenLevel || 'easy';
  if (isDuel){ gridSize = DUEL_SIZE; dotCount = DUEL_DOTS; }
  else { gridSize = LEVELS[level].size; dotCount = LEVELS[level].dots; firstEasyRound = level==='easy'; loadBest(); }
  streak = 0; lives = MAX_LIVES; hints = MAX_HINTS; bestAnnounced = false;
  duelScores = [0,0]; current = 0; activePlayer = -1;
  found = []; hintRevealed = {}; wrongIndex = null;
  showGameOver = false;
  $gameover.classList.remove('show');
  $landingView.classList.remove('active');
  $gameView.classList.add('active');
  buildGrid();
  renderLivesCanvas(lives);
  document.querySelector('#game-view .mg-footer canvas').style.display = isDuel ? 'none' : 'block';
  renderStatusRow();
  renderHintButton();
  setupConfettiCanvas();
  document.title = 'Memory Grid — Mil ke Khelo!';
  runCountdown(function(){
    if (isDuel) duelStartRound(); else soloNewRound();
  });
}
function backToLanding(){
  clearInterval(countdownTimer);
  clearTimeout(flashTimer); clearTimeout(newBestTimer);
  $gameView.classList.remove('active');
  $landingView.classList.add('active');
}

/* ─────────────────────────── Heartbeat start (staggered, like app) ─────────────────────────── */
function startHeartbeats(){
  var delays = [0, 260, 520];
  for (var i=0;i<3;i++){
    (function(i){
      setTimeout(function(){
        var el = document.getElementById('hb-'+i);
        if (el) el.style.animationPlayState = 'running';
      }, delays[i] + 600);
    })(i);
  }
}

/* ─────────────────────────── Init ─────────────────────────── */
applyLang();
updateSoundButtons();
