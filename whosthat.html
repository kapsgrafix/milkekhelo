<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mil ke Khelo!">
<meta name="theme-color" content="#3D0F1E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Who's That? — Mil ke Khelo!</title>
<meta name="description" content="Who's That? is a free multiplayer party game. Answer questions about your friends — if everyone picks the same person, your team scores. Play with 2+ players on any phone.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://milkekhelo.com/whosthat.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://milkekhelo.com/whosthat.html">
<meta property="og:title" content="Who's That? — Mil ke Khelo!">
<meta property="og:description" content="How well does your group know each other? Answer together, score together.">
<meta property="og:image" content="https://milkekhelo.com/images/home/card_whos_that_en.webp">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --screen-bg:#3D0F1E;
  --surface:rgba(255,255,255,.14);
  --border-default:rgba(255,255,255,.28);
  --text-primary:#FFFFFF;
  --text-on-light:#1B2340;
  --text-muted:#BABABA;
  --brand-yellow:#FFC53D;
  --wt-pink:#FF5D8F;
  --wt-green:#33C481;
  --wt-red:#E03D3D;
  --cta-top:#FFE08A; --cta-bottom:#C97F00; --cta-shadow:#7A4B00; --cta-pressed:#E1AB3E;
  --create-top:#FF93B3; --create-bottom:#CC2F63; --create-shadow:#701A36;
  --join-top:#C3B0F5; --join-bottom:#6A4FC2; --join-shadow:#3A2B6B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--screen-bg);font-family:'Baloo 2',sans-serif;overscroll-behavior:none;}
body{overflow:hidden;}
/* Mobile layout only — even on a wide desktop window the game stays a
   phone-width column, centered, never stretching to fill the screen. */
#stack{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:var(--screen-bg);}
.view{position:absolute;inset:0;display:none;flex-direction:column;}
.view.active{display:flex;}

/* ── Header (shared GameHeader) ── */
.hdr{display:flex;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));gap:8px;flex-shrink:0;}
.hdr-left{display:flex;align-items:center;gap:8px;min-width:72px;}
.icon-btn{width:32px;height:32px;border-radius:12px;background:var(--surface);border:1px solid var(--border-default);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text-primary);
  font-size:16px;font-weight:800;touch-action:manipulation;user-select:none;}
.icon-btn.muted{color:var(--text-muted);}
.icon-img{display:block;width:18px;height:18px;flex-shrink:0;pointer-events:none;}
.hdr-title{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lang-toggle{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border-default);border-radius:12px;overflow:hidden;padding:4px;height:32px;flex-shrink:0;}
.lang-btn{padding:0 10px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;background:transparent;border:none;font-family:'Baloo 2',sans-serif;height:100%;display:flex;align-items:center;border-radius:8px;}
.lang-btn.active{background:var(--brand-yellow);color:var(--text-on-light);}

/* ── Ad-strip placeholder (no ads on web) ── */
.ad-strip{flex-shrink:0;height:50px;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(0,0,0,.22);}

/* ── Landing (GameLandingBody) ── */
#landing-body{flex:1;overflow:auto;padding:0 24px;}
#landing-inner{min-height:100%;display:flex;align-items:center;justify-content:center;}
#landing-stack{padding:24px 0;display:flex;flex-direction:column;align-items:center;width:100%;max-width:312px;margin:0 auto;}
.wt-hero{width:180px;height:180px;object-fit:contain;display:block;}
.wt-cards{width:100%;margin-top:48px;display:flex;flex-direction:column;}
.wt-card-wrap{width:100%;height:86px;position:relative;}
.wt-card-wrap + .wt-card-wrap{margin-top:26px;}
.wt-heartbeat{width:100%;height:100%;animation:wtHeartbeat 2.6s ease-in-out infinite;animation-play-state:paused;}
@keyframes wtHeartbeat{
  0%{transform:scale(1);} 7%{transform:scale(1.03);} 15%{transform:scale(1);}
  21%{transform:scale(1.02);} 33%{transform:scale(1);} 100%{transform:scale(1);}
}
.wt-card{position:relative;width:100%;height:100%;cursor:pointer;touch-action:manipulation;user-select:none;}
.wt-card-shadow{position:absolute;left:0;right:0;bottom:0;height:80px;border-radius:24px;}
.wt-card-face{position:absolute;left:0;right:0;top:0;height:80px;border-radius:24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:top .09s ease-out;overflow:hidden;padding:0 16px;text-align:center;}
.wt-card.pressed .wt-card-face{top:6px;}
.wt-card.pressed .wt-card-face::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.18);}
.wt-card-title{font-size:28px;font-weight:800;line-height:1.15;color:#fff;white-space:nowrap;
  -webkit-text-stroke:3px rgba(0,0,0,.65);paint-order:stroke fill;}
.wt-card-sub{font-size:15px;font-weight:500;line-height:1.4;color:#fff;white-space:nowrap;}

/* ── Scroll body shared by create/join/lobby/question/reveal/end ── */
.scroll-body{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;}
.center-col{width:100%;max-width:312px;margin:0 auto;padding:20px 24px;display:flex;flex-direction:column;flex:1;}
/* Create Game + Lobby (code/player-list): widen body content to ~80% of the mobile screen width (Oct 22) */
#create-view .center-col, #lobby-view .center-col { max-width:416px; padding-left:16px; padding-right:16px; }
.wt-heading{text-align:center;}
.wt-h1{font-size:28px;font-weight:800;line-height:1.15;color:#fff;}
.wt-sub{font-size:14px;font-weight:500;color:var(--text-muted);margin-top:2px;}

/* ── Form card ── */
.form-card{width:100%;background:rgba(0,0,0,.35);border-radius:22px;padding:20px 18px;margin-top:20px;}
.f-field + .f-field{margin-top:16px;}
.f-label{font-size:11px;font-weight:800;color:var(--text-muted);letter-spacing:.66px;margin-bottom:7px;display:block;}
.f-hint{font-size:11px;font-weight:600;color:var(--text-muted);margin-top:7px;}
.f-row{width:100%;background:var(--surface);border:1.5px solid var(--border-default);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:10px;font-family:'Baloo 2',sans-serif;}
.f-row input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Baloo 2',sans-serif;
  font-size:16px;font-weight:500;min-width:0;}
.f-row input::placeholder{color:var(--text-muted);}
.f-select{width:100%;background:var(--surface);border:1.5px solid var(--border-default);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;touch-action:manipulation;}
.f-select-val{font-size:16px;font-weight:700;color:#fff;}
.f-select-arrow{font-size:13px;color:#fff;}
.f-code-input{text-align:center;font-size:30px;font-weight:800;letter-spacing:9px;text-transform:uppercase;padding:16px 10px;}

/* ── Stepper ── */
.stepper{display:flex;align-items:stretch;gap:9px;}
.stepper-btn{width:48px;height:48px;flex-shrink:0;background:var(--wt-pink);border:none;border-radius:12px;
  color:#fff;font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;
  line-height:1;touch-action:manipulation;font-family:'Baloo 2',sans-serif;}
.stepper-btn:disabled{opacity:.4;}
.stepper-val{flex:1;background:var(--surface);border:1.5px solid var(--border-default);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;}

/* ── Picker sheet ── */
#picker-overlay{position:fixed;inset:0;z-index:420;background:rgba(5,10,20,.6);display:none;align-items:flex-end;justify-content:center;}
#picker-overlay.open{display:flex;}
#picker-sheet{width:100%;max-width:480px;background:rgba(93,23,48,.92);border-top:1px solid rgba(255,93,143,.5);
  border-radius:22px 22px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1,.4,1);}
#picker-overlay.open #picker-sheet{transform:translateY(0);}
.picker-handle{width:40px;height:4px;background:rgba(255,255,255,.24);border-radius:2px;margin:0 auto 16px;}
.picker-opt{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border-default);background:var(--surface);
  color:#fff;font-size:16px;font-weight:700;font-family:'Baloo 2',sans-serif;text-align:left;cursor:pointer;margin-bottom:8px;
  touch-action:manipulation;}
.picker-opt.active{border-color:var(--wt-pink);background:rgba(255,93,143,.16);}

/* ── Chunky button ── */
.chunky-btn{height:48px;width:100%;padding:0 24px;border-radius:16px;border:none;cursor:pointer;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;color:var(--text-on-light);
  background:linear-gradient(180deg,var(--cta-top) 0%,var(--cta-bottom) 100%);
  box-shadow:0 4px 0 var(--cta-shadow);margin-bottom:4px;touch-action:manipulation;}
.chunky-btn:active:not(:disabled){margin-top:4px;margin-bottom:0;box-shadow:none;background:var(--cta-pressed);}
.chunky-btn:disabled{opacity:.4;}
.ghost-btn{height:48px;width:100%;border-radius:16px;border:2px solid var(--border-default);background:transparent;
  color:#fff;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;cursor:pointer;touch-action:manipulation;}
.ghost-btn:active{background:var(--surface);}

/* ── Lobby ── */
.code-box{width:100%;background:rgba(255,93,143,.13);border:2px dashed rgba(255,93,143,.5);border-radius:24px;
  padding:20px 24px;text-align:center;}
.code-label{font-size:11px;font-weight:800;color:var(--text-muted);letter-spacing:.88px;}
.code-value{font-size:40px;font-weight:800;line-height:1.1;color:var(--brand-yellow);margin-top:8px;}
.copy-chip{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--border-default);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;
  color:#fff;cursor:pointer;touch-action:manipulation;font-family:'Baloo 2',sans-serif;}
.lobby-head{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:0 4px;}
.lobby-head-title{font-size:12px;font-weight:800;color:var(--text-muted);letter-spacing:.96px;}
.lobby-count{font-size:12px;font-weight:800;color:var(--wt-pink);background:rgba(255,93,143,.16);
  border-radius:999px;padding:3px 11px;}
.wt-chip{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border-default);
  border-radius:15px;padding:11px 14px;margin-top:8px;}
.wt-chip.empty{border-style:dashed;}
.wt-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#fff;}
.wt-avatar.sm{width:28px;height:28px;font-size:13px;}
.wt-avatar.empty{background:var(--surface);color:var(--text-muted);font-size:13px;}
.wt-chip-name{font-size:15px;font-weight:800;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wt-chip-name.empty{color:var(--text-muted);font-weight:700;}
.host-tag{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--brand-yellow);
  background:rgba(255,197,61,.16);border-radius:999px;padding:3px 9px;flex-shrink:0;}
.foot-note{text-align:center;font-size:14px;font-weight:700;color:var(--text-muted);}
.dots::after{content:'';animation:dotsAnim 1.4s steps(4,end) infinite;}
@keyframes dotsAnim{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* ── Foot sheet (lobby / reveal) ── */
.foot-sheet{flex-shrink:0;width:100%;background:rgba(0,0,0,.22);border-top:1px solid rgba(255,93,143,.5);
  border-radius:22px 22px 0 0;padding:16px 20px calc(28px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;}

/* ── Score row ── */
.score-row{display:flex;gap:12px;padding:8px 12px;flex-shrink:0;}
.score-box{flex:1;background:var(--surface);border:2px solid var(--border-default);border-radius:16px;
  padding:10px 16px;text-align:center;}
.score-val{font-size:15px;font-weight:800;color:#fff;}
.score-lbl{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.66px;text-transform:uppercase;margin-top:2px;}
.code-line{text-align:center;font-size:10px;font-weight:600;color:rgba(186,186,186,.55);letter-spacing:1px;
  padding:2px 0 0;flex-shrink:0;}

/* ── Question card ── */
.q-card{width:100%;background:rgba(255,93,143,.15);border:1px solid rgba(255,93,143,.5);border-radius:24px;
  padding:24px 22px;text-align:center;}
.q-num{font-size:11px;font-weight:800;color:var(--wt-pink);letter-spacing:1.76px;}
.q-text{font-size:23px;font-weight:700;color:#fff;line-height:1.3;margin-top:9px;}

/* ── Answer options ── */
.opt{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.071);border:2px solid var(--border-default);
  border-radius:17px;padding:0 16px;height:66px;cursor:pointer;touch-action:manipulation;transition:background .16s,border-color .16s;}
.opt.selected{background:rgba(255,197,61,.14);border-color:var(--brand-yellow);}
.opt.locked{pointer-events:none;}
.opt-check{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-on-light);}
.opt.selected .opt-check{background:var(--brand-yellow);border-color:var(--brand-yellow);}
.opt-name-wrap{flex:1;min-width:0;}
.opt-name{font-size:17px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.opt-answered{font-size:12px;font-weight:600;color:var(--wt-green);margin-top:2px;display:block;}

/* ── Reveal ── */
.reveal-banner{width:100%;border-radius:22px;padding:22px;text-align:center;position:relative;overflow:hidden;}
.reveal-emoji{font-size:44px;line-height:1;}
.reveal-emoji.big{font-size:52px;}
.reveal-title{font-size:24px;font-weight:800;color:#fff;margin-top:6px;}
.reveal-line{font-size:14px;font-weight:700;color:var(--text-muted);margin-top:6px;line-height:1.4;}
.reveal-plus{color:var(--wt-green);font-weight:800;}
#rev-confetti{position:absolute;inset:0;pointer-events:none;}
.vote-row{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:14px;padding:11px 14px;margin-top:8px;}
.vote-name{font-size:14px;font-weight:800;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vote-arrow{color:var(--text-muted);font-size:13px;flex-shrink:0;}
.vote-to{font-size:15px;font-weight:800;color:var(--brand-yellow);flex:2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── End ── */
.end-wrap{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;}
.end-emoji{font-size:76px;line-height:1;}
.end-title{font-size:32px;font-weight:800;text-align:center;margin-top:8px;line-height:1.15;}
.end-sub{font-size:15px;font-weight:700;color:var(--text-muted);text-align:center;margin-top:8px;}
.end-buttons{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:14px;}

/* ── Toast ── */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(6,14,34,.96);
  border:1px solid rgba(255,255,255,.16);border-radius:50px;padding:12px 24px;font-size:14px;font-weight:700;color:#fff;
  z-index:999;opacity:0;transition:all .3s cubic-bezier(.34,1.4,.64,1);pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 28px rgba(0,0,0,.4);max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── How to play sheet ── */
#how-overlay{position:fixed;inset:0;z-index:400;background:rgba(5,10,20,.6);display:none;align-items:flex-end;justify-content:center;}
#how-overlay.open{display:flex;}
#how-sheet{width:100%;max-width:480px;background:linear-gradient(160deg,#4A1226,#2A0A16);
  border-radius:26px 26px 0 0;padding:16px 24px 32px;padding-bottom:max(32px,env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.34,1,.4,1);}
#how-overlay.open #how-sheet{transform:translateY(0);}
.how-grabber{width:40px;height:4px;background:rgba(255,255,255,.22);border-radius:2px;margin:0 auto 20px;}
.how-title{font-size:22px;font-weight:800;color:var(--wt-pink);}
.how-step{display:flex;gap:14px;margin-top:16px;align-items:flex-start;}
.how-step:first-of-type{margin-top:20px;}
.how-num{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:var(--wt-pink);color:#fff;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.how-step-title{font-size:15px;font-weight:700;color:#fff;}
.how-step-body{font-size:13px;font-weight:600;color:rgba(255,255,255,.6);margin-top:2px;line-height:1.5;}
.how-goal{margin-top:20px;background:rgba(255,93,143,.1);border:1px solid rgba(255,93,143,.3);border-radius:16px;padding:16px;}
.how-goal-title{font-size:15px;font-weight:800;color:#fff;}
.how-goal-text{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-top:6px;line-height:1.5;}

/* ── Confetti ── */
#confetti-canvas{position:fixed;inset:0;z-index:600;pointer-events:none;display:none;}
#confetti-canvas.on{display:block;}
</style>
</head>
<body>
<div id="stack">

  <!-- ══════════════ LANDING ══════════════ -->
  <div class="view active" id="landing-view">
    <div class="hdr">
      <div class="hdr-left">
        <button class="icon-btn" id="lv-back" aria-label="Back"><img class="icon-img" src="images/icons/icon-back.webp" alt=""></button>
        <button class="icon-btn" id="lv-sound" aria-label="Sound"><img class="icon-img" src="images/icons/icon-sound.webp" alt=""></button>
        <button class="icon-btn" id="lv-help" aria-label="How to play"><img class="icon-img" src="images/icons/icon-help.webp" alt=""></button>
      </div>
      <div class="hdr-title"></div>
      <div class="lang-toggle">
        <button class="lang-btn active" id="lv-lb-en">EN</button>
        <button class="lang-btn" id="lv-lb-hi">हिं</button>
      </div>
    </div>
    <div id="landing-body">
      <div id="landing-inner">
        <div id="landing-stack">
          <img class="wt-hero" id="wt-hero-img" src="images/home/card_whos_that_en.webp" alt="Who's That?">
          <div class="wt-cards">
            <div class="wt-card-wrap"><div class="wt-heartbeat" id="hb-0"><div class="wt-card" id="card-create">
              <div class="wt-card-shadow" style="background:var(--create-shadow);"></div>
              <div class="wt-card-face" style="background:linear-gradient(180deg,var(--create-top),var(--create-bottom));">
                <div class="wt-card-title" id="card-create-title"></div>
                <div class="wt-card-sub" id="card-create-sub"></div>
              </div>
            </div></div></div>
            <div class="wt-card-wrap"><div class="wt-heartbeat" id="hb-1"><div class="wt-card" id="card-join">
              <div class="wt-card-shadow" style="background:var(--join-shadow);"></div>
              <div class="wt-card-face" style="background:linear-gradient(180deg,var(--join-top),var(--join-bottom));">
                <div class="wt-card-title" id="card-join-title"></div>
                <div class="wt-card-sub" id="card-join-sub"></div>
              </div>
            </div></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="ad-strip"></div>
  </div>

  <!-- ══════════════ CREATE ══════════════ -->
  <div class="view" id="create-view">
    <div class="hdr">
      <div class="hdr-left">

function getPref(key, def) { try { const v = localStorage.getItem(key); return v===null?def:v==='1'; } catch(e){ return def; } }
function setPref(key, val) { try { localStorage.setItem(key, val?'1':'0'); } catch(e){} }
let prefSfx = getPref('mkk-fx-sfx', true);
let prefVibe = getPref('mkk-fx-vibration', true);
const AUDIO_CACHE = {};
function sfx(name) {
  if (!prefSfx) return;
  try {
    let a = AUDIO_CACHE[name];
    if (!a) { a = new Audio('audio/sfx/' + name + '.mp3'); AUDIO_CACHE[name] = a; }
    else { a.currentTime = 0; }
    a.play().catch(()=>{});
  } catch(e){}
}
function vibrate(ms) { if (prefVibe && navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} } }
const Fx = {
  tap:()=>{ sfx('tap'); vibrate(10); },
  toggle:()=>{ sfx('toggle'); vibrate(10); },
  cardFlip:()=>{ sfx('card_flip'); vibrate(12); },
  turn:()=>{ sfx('turn'); vibrate(12); },
  roundWin:()=>{ sfx('round_win'); vibrate(16); },
  win:()=>{ sfx('win'); vibrate(20); },
  lose:()=>{ sfx('lose'); vibrate(16); }
};
function updateSoundButtons() {
  const on = prefSfx || prefVibe;
  document.querySelectorAll('[id$="-sound"]').forEach(btn => {
    btn.classList.toggle('muted', !on);
    const img = btn.querySelector('.icon-img');
    if (img) img.src = on ? 'images/icons/icon-sound.webp' : 'images/icons/icon-sound-off.webp';
  });
}
function toggleSound() {
  const on = prefSfx || prefVibe;
  prefSfx = !on; prefVibe = !on;
  setPref('mkk-fx-sfx', prefSfx); setPref('mkk-fx-vibration', prefVibe);
  updateSoundButtons();
  if (prefSfx) Fx.toggle();
}

const AVATAR_COLORS = ['#2563EB','#22D3EE','#FBBF24','#4ADE80','#EC4899','#F87171','#818CF8','#FB923C','#2DD4BF','#60A5FA'];
let db = null, gameRef = null, unsub = null;
let myId = null, myName = '', isHost = false, currentCode = '';
let gameState = null, lastPhase = '', lastQIndex = -1;
let qCountChoice = 10, targetChoice = 5;

function avatarColor(id) {
  let sum = 0;
  for (const ch of String(id)) sum += ch.charCodeAt(0);
  return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}
function initial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function makeCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function makeId() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function freshQuestions(count) {
  const all = QUESTIONS.en.map((_, i) => i);
  return shuffle(all).slice(0, count);
}
function playersArray(state) {
  if (!state || !state.players) return [];
  return Object.entries(state.players)
    .map(([id, p]) => ({ id, ...p }))
    .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
}
function questionText(s, i) {
  const idxList = s.qIdx || null;
  if (idxList && typeof idxList[i] === 'number') {
    const bank = QUESTIONS[lang] || QUESTIONS.en;
    return bank[idxList[i]] || '';
  }
  return '';
}

/// Who got picked, and whether it was unanimous / a majority pick / a tie —
/// mirrors WtSession.roundResult in wt_session.dart exactly.
function computeRoundResult(s, players) {
  const answers = s.answers || {};
  const ids = players.map(p => p.id);
  const picks = ids.filter(id => answers[id] != null).map(id => answers[id]);
  if (!picks.length) return null;
  if (picks.every(x => x === picks[0])) return { outcome: 'bullseye', picked: [picks[0]] };
  const counts = {};
  picks.forEach(p => { counts[p] = (counts[p] || 0) + 1; });
  const top = Math.max(...Object.values(counts));
  const leaders = [];
  ids.forEach(id => { if (counts[id] === top) leaders.push(id); });
  Object.keys(counts).forEach(id => { if (counts[id] === top && !ids.includes(id)) leaders.push(id); });
  if (leaders.length === 1) return { outcome: 'crowdPick', picked: leaders };
  return { outcome: 'tie', picked: leaders };
}

// ═══════════════════════════════════════════════════════════════
//  FIREBASE INIT (compat SDK loaded via <script src>)
// ═══════════════════════════════════════════════════════════════
let fb = {};
let fbReady = false;
let fbWaiting = null;
function buildWrapper() {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  fb = {
    ref: (_db, path) => db.ref(path),
    set: (ref, val) => ref.set(val),
    update: (ref, val) => ref.update(val),
    get: (ref) => ref.once('value'),
    remove: (ref) => ref.remove(),
    onValue: (ref, cb) => { const h = ref.on('value', cb); return () => ref.off('value', h); }
  };
  fbReady = true;
}
function initFirebase() {
  if (fbReady) return true;
  if (!CONFIGURED) return false;
  if (typeof firebase === 'undefined' || !firebase.database) return false;
  try { buildWrapper(); return true; } catch (err) { console.error('Firebase init failed', err); return false; }
}
function waitForFirebase(timeoutMs = 9000) {
  if (fbReady) return Promise.resolve(true);
  if (fbWaiting) return fbWaiting;
  fbWaiting = new Promise(resolve => {
    const started = Date.now();
    (function poll() {
      if (initFirebase()) { resolve(true); return; }
      if (Date.now() - started > timeoutMs) { resolve(false); return; }
      setTimeout(poll, 220);
    })();
  });
  return fbWaiting;
}
async function ensureReady() {
  if (!CONFIGURED) { toast('Firebase not configured'); return false; }
  if (fbReady) return true;
  toast('Connecting…', 1200);
  const ok = await waitForFirebase();
  if (!ok) { toast(t().networkError, 3200); return false; }
  return true;
}

// ═══════════════════════════════════════════════════════════════
//  PRESENCE — auto-remove on disconnect (web-only; the app uses its
//  own heartbeat scheme instead — see wt_session.dart)
// ═══════════════════════════════════════════════════════════════
let presenceRef = null, connectedRef = null, connectedHandler = null;
function setupPresence() {
  if (!db || !currentCode || !myId) return;
  presenceRef = db.ref(`whosthat/${currentCode}/players/${myId}`);
  connectedRef = db.ref('.info/connected');
  connectedHandler = connectedRef.on('value', (snap) => {
    if (snap.val() === true && presenceRef) presenceRef.onDisconnect().remove();
  });
}
function teardownPresence() {
  try { if (presenceRef) presenceRef.onDisconnect().cancel(); } catch (e) {}
  if (connectedRef && connectedHandler) connectedRef.off('value', connectedHandler);
  presenceRef = null; connectedRef = null; connectedHandler = null;
}

function showView(id) {

function toast(msg, ms = 2200) {

  el.textContent = msg;

  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), ms);
}
function fireConfetti(duration = 2600) {
  const cv = document.getElementById('confetti-canvas');
  cv.classList.add('on');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const colors = ['#60A5FA','#FBBF24','#4ADE80','#F87171','#EC4899','#22D3EE','#fff'];
  const bits = [];
  for (let i = 0; i < 120; i++) {
    bits.push({
      x: Math.random() * cv.width, y: -Math.random() * cv.height * 0.6,
      w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
      c: colors[Math.floor(Math.random() * colors.length)],
      vy: (0.55 + Math.random() * 0.6) * cv.height, vx: (-0.08 + Math.random() * 0.16) * cv.width,
      rot: Math.random() * 360, vr: -6 + Math.random() * 12
    });
  }
  const start = performance.now();
  (function frame(now) {
    const el = (now - start) / 1000;
    ctx.clearRect(0, 0, cv.width, cv.height);
    const fade = el > 2.1 ? Math.max(0, (2.6 - el) / 0.5) : 1;
    bits.forEach(b => {
      const x = b.x + b.vx * el, y = b.y + b.vy * el;
      if (y < -20 || y > cv.height + 20) return;
      ctx.save(); ctx.translate(x, y); ctx.rotate((b.rot + b.vr * el * 60) * Math.PI / 180);
      ctx.fillStyle = b.c; ctx.globalAlpha = fade;
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h); ctx.restore();
    });
    if (el < duration/1000) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.classList.remove('on'); }
  })(start);
}
/// Gentle looping confetti drifting through the Bullseye banner card.
let revConfettiRaf = null;
function startRevConfetti() {
  const cv = document.getElementById('rev-confetti');
  const banner = document.getElementById('rev-banner');
  const resize = () => { cv.width = banner.clientWidth; cv.height = banner.clientHeight; };
  resize();
  const colors = ['#FBBF24','#EC4899','#22D3EE','#4ADE80','#FB923C','#60A5FA'];
  const pieces = [];
  for (let i = 0; i < 22; i++) {
    pieces.push({
      x: Math.random(), phase: Math.random(), speed: 1 + Math.round(Math.random()),
      sway: 4 + Math.random() * 6, size: 5 + Math.random() * 3,
      spin: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  const ctx = cv.getContext('2d');
  const start = performance.now();
  function frame(now) {
    if (!document.body.contains(cv) || !document.getElementById('reveal-view').classList.contains('active')) { revConfettiRaf = null; return; }
    resize();
    const tLoop = ((now - start) / 6000) % 1;
    ctx.clearRect(0, 0, cv.width, cv.height);
    pieces.forEach(p => {
      const f = (tLoop * p.speed + p.phase) % 1;
      const y = -12 + f * (cv.height + 24);
      const x = p.x * cv.width + Math.sin((f + p.phase) * Math.PI * 4) * p.sway;
      const a = (f < 0.1 ? f/0.1 : (f > 0.85 ? (1-f)/0.15 : 1)) * 0.75;
      ctx.save(); ctx.translate(x, y); ctx.rotate(f * p.spin * Math.PI);
      ctx.globalAlpha = Math.max(0, Math.min(1, a)); ctx.fillStyle = p.color;
      const w = p.size, h = p.size * 0.7;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-w/2, -h/2, w, h, w*0.2) : ctx.rect(-w/2, -h/2, w, h);
      ctx.fill(); ctx.restore();
    });
    revConfettiRaf = requestAnimationFrame(frame);
  }
  if (!revConfettiRaf) revConfettiRaf = requestAnimationFrame(frame);
}

async function createGame() {

//  JOIN GAME
// ═══════════════════════════════════════════════════════════════
async function joinGame() {
  if (!(await ensureReady())) return;
  const code = document.getElementById('in-code').value.trim().toUpperCase();
  const name = document.getElementById('in-name').value.trim();
  if (code.length !== 4) { toast(t().enterCode); return; }
  if (!name) { toast(t().enterName); return; }

  const btn = document.getElementById('btn-join-go');
  btn.disabled = true; btn.textContent = t().joining;
  try {
    const ref = fb.ref(db, 'whosthat/' + code);
    const snap = await fb.get(ref);
    if (!snap.exists()) { toast(t().noGame); return; }
    const state = snap.val();
    if (state.phase !== 'lobby') { toast(t().alreadyStarted); return; }
    const existing = state.players ? Object.keys(state.players).length : 0;
    if (existing >= 10) { toast(t().gameFull); return; }

    myId = makeId(); myName = name; isHost = false; currentCode = code; gameRef = ref;
    await fb.set(fb.ref(db, `whosthat/${code}/players/${myId}`), { name, isHost: false, joinedAt: Date.now() });
    setupPresence();
    attachListener();
    showView('lobby-view');
  } catch (err) {
    console.error(err);
    toast(t().networkError);
  } finally {
    btn.disabled = false; btn.textContent = t().joinGame;
  }
}

// ═══════════════════════════════════════════════════════════════
//  REALTIME LISTENER
// ═══════════════════════════════════════════════════════════════
function attachListener() {
  if (unsub) unsub();
  unsub = fb.onValue(gameRef, snap => {
    if (!snap.exists()) {
      toast(t().gameEnded);
      cleanup();
      showView('landing-view');
      return;
    }
    gameState = snap.val();
    render();
  });
}
function cleanup() {
  teardownPresence();
  if (unsub) { unsub(); unsub = null; }
  gameRef = null; gameState = null; myId = null; isHost = false; currentCode = '';
  lastPhase = ''; lastQIndex = -1;
  renderReveal._celebrated = false;
}

// ═══════════════════════════════════════════════════════════════
//  RENDER — drives every in-game screen from shared state
// ═══════════════════════════════════════════════════════════════
function render() {
  if (!gameState) return;
  const s = gameState;
  const players = playersArray(s);

  if (s.phase === 'lobby') { renderLobby(s, players); showView('lobby-view'); }
  else if (s.phase === 'question') { renderQuestion(s, players); showView('question-view'); }
  else if (s.phase === 'reveal') { renderReveal(s, players); showView('reveal-view'); }
  else if (s.phase === 'end') { renderEnd(s); showView('end-view'); }

  // Moments: a sound/haptic when the phase actually changes.
  if (s.phase !== lastPhase || s.qIndex !== lastQIndex) {
    if (s.phase === 'question' && lastPhase) Fx.cardFlip();
    else if (s.phase === 'reveal') {
      const r = computeRoundResult(s, players);
      if (r && r.outcome === 'bullseye') Fx.roundWin(); else Fx.turn();
    } else if (s.phase === 'end' && lastPhase) { if (s.won) Fx.win(); else Fx.lose(); }
    lastPhase = s.phase; lastQIndex = s.qIndex;
  }
}

// ── QUESTION ──
function renderQuestion(s, players) {
  const L = t();
  const answers = s.answers || {};
  const myAnswer = answers[myId];

  document.getElementById('q-score').textContent = `${s.score} / ${s.target}`;
  document.getElementById('q-remaining').textContent = s.qCount - s.qIndex;
  document.getElementById('q-code-line').textContent = `${L.gameCode} · ${currentCode}`;
  document.getElementById('q-num').textContent = L.questionNo(s.qIndex + 1);
  document.getElementById('q-text').textContent = questionText(s, s.qIndex);

  const opts = document.getElementById('q-opts');
  opts.innerHTML = players.map(p => {
    const hasAnswered = answers[p.id] != null;
    const selected = myAnswer === p.id;
    return `
    <div class="opt ${selected ? 'selected' : ''} ${myAnswer ? 'locked' : ''}" data-pick="${p.id}">
      <div class="opt-check">${selected ? '✓' : ''}</div>
      <div class="wt-avatar sm" style="width:34px;height:34px;font-size:14px;background:${avatarColor(p.id)}">${escapeHtml(initial(p.name))}</div>
      <div class="opt-name-wrap">
        <span class="opt-name">${escapeHtml(p.name)}${p.id === myId ? ' ' + L.youLower : ''}</span>
        ${hasAnswered ? `<span class="opt-answered">${escapeHtml(L.answered)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  opts.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => submitAnswer(el.dataset.pick)));

  const note = document.getElementById('q-locked-note');
  note.style.display = myAnswer ? 'block' : 'none';
  note.textContent = L.locked;

  const playerIds = players.map(p => p.id);
  const validAnswers = playerIds.filter(id => answers[id] != null);
  if (isHost && validAnswers.length === players.length && players.length >= 2 && !renderQuestion._resolving) {
    renderQuestion._resolving = true;
    setTimeout(() => { renderQuestion._resolving = false; resolveRound(); }, 600);
  }
}
async function submitAnswer(targetId) {
  if (!gameState || gameState.phase !== 'question') return;
  if ((gameState.answers || {})[myId]) return;
  Fx.tap();
  try { await fb.set(fb.ref(db, `whosthat/${currentCode}/answers/${myId}`), targetId); }
  catch (err) { toast(t().sendFailed); }
}

// ── RESOLVE (host only) — mirrors WtSession._resolve() ──
async function resolveRound() {
  const s = gameState;
  if (!s || s.phase !== 'question') return;
  const players = playersArray(s);
  const answers = s.answers || {};
  const playerIds = players.map(p => p.id);
  const values = playerIds.map(id => answers[id]).filter(v => v != null);
  if (players.length < 2 || values.length < players.length) return;

  const unanimous = values.every(v => v === values[0]);
  const newScore = s.score + (unanimous ? 1 : 0);
  const hitTarget = newScore >= s.target;
  try {
    await fb.update(fb.ref(db, 'whosthat/' + currentCode), {
      phase: 'reveal', score: newScore,
      lastUnanimous: unanimous, lastPickedId: unanimous ? values[0] : null,
      targetHit: hitTarget
    });
    if (hitTarget) {
      setTimeout(async () => {
        await fb.update(fb.ref(db, 'whosthat/' + currentCode), { phase: 'end', won: true });
      }, 2000);
    }
  } catch (err) { console.error(err); }
}

// ── REVEAL — 3 outcomes: Bullseye / Crowd's Pick / Tie ──
function renderReveal(s, players) {
  const L = t();
  const nameOf = id => { const p = players.find(x => x.id === id); return p ? p.name : '—'; };
  const answers = s.answers || {};
  const result = computeRoundResult(s, players);

  const banner = document.getElementById('rev-banner');
  const emojiEl = document.getElementById('rev-emoji');
  const titleEl = document.getElementById('rev-title');
  const lineEl = document.getElementById('rev-line');

  if (result) {
    if (result.outcome === 'bullseye') {
      banner.style.background = 'rgba(51,196,129,.16)'; banner.style.border = '2px solid rgba(51,196,129,.55)';
      emojiEl.textContent = '🎯'; emojiEl.classList.add('big');
      titleEl.textContent = L.bullseye; titleEl.style.color = '#fff';
      lineEl.innerHTML = escapeHtml(L.everyonePicked(nameOf(result.picked[0]))) + `<span class="reveal-plus">${escapeHtml(L.plusOne)}</span>`;
      document.getElementById('rev-confetti').style.display = 'block';
      startRevConfetti();
    } else if (result.outcome === 'crowdPick') {
      banner.style.background = 'rgba(255,93,143,.16)'; banner.style.border = '2px solid rgba(255,93,143,.55)';
      emojiEl.textContent = '👑'; emojiEl.classList.remove('big');
      titleEl.textContent = L.crowdsPick; titleEl.style.color = '#fff';
      lineEl.textContent = L.crowdSub(nameOf(result.picked[0]));
      document.getElementById('rev-confetti').style.display = 'none';
    } else {
      banner.style.background = 'rgba(255,197,61,.16)'; banner.style.border = '2px solid rgba(255,197,61,.55)';
      emojiEl.textContent = '🤝'; emojiEl.classList.remove('big');
      titleEl.textContent = L.tie; titleEl.style.color = '#fff';
      lineEl.textContent = L.tieSub(result.picked.map(nameOf));
      document.getElementById('rev-confetti').style.display = 'none';
    }
  }

  document.getElementById('rev-votes').innerHTML = players.map(p => {
    const toId = answers[p.id];
    const to = toId == null ? '—' : (toId === p.id ? nameOf(toId) + ' ' + L.self : nameOf(toId));
    return `
    <div class="vote-row">
      <div class="wt-avatar sm" style="background:${avatarColor(p.id)}">${escapeHtml(initial(p.name))}</div>
      <div class="vote-name">${escapeHtml(p.name)}</div>
      <div class="vote-arrow">→</div>
      <div class="vote-to">${escapeHtml(to)}</div>
    </div>`;
  }).join('');

  document.getElementById('rev-score').textContent = `${s.score} / ${s.target}`;
  document.getElementById('rev-remaining').textContent = Math.max(0, s.qCount - s.qIndex - 1);
  document.getElementById('rev-code-line').textContent = `${L.gameCode} · ${currentCode}`;

  const isLast = s.qIndex + 1 >= s.qCount;
  const reachedTarget = s.score >= s.target;
  const foot = document.getElementById('reveal-foot');
  const adStrip = document.getElementById('reveal-ad');

  if (reachedTarget) {
    if (!renderReveal._celebrated) { renderReveal._celebrated = true; fireConfetti(2000); }
    foot.style.display = 'none'; adStrip.style.display = 'block';
    return;
  }
  renderReveal._celebrated = false;
  foot.style.display = 'flex'; adStrip.style.display = 'none';
  if (isHost) {
    foot.innerHTML = `<button class="chunky-btn" id="btn-next-q">${escapeHtml(isLast ? L.seeResults : L.nextQuestion)}</button>`;
    document.getElementById('btn-next-q').addEventListener('click', nextQuestion);
  } else {
    foot.innerHTML = `<div class="foot-note">${escapeHtml(L.waitHost)}<span class="dots"></span></div>`;
  }
}
async function nextQuestion() {
  const s = gameState;
  if (!s || !isHost) return;
  const isLast = s.qIndex + 1 >= s.qCount;
  const reachedTarget = s.score >= s.target;
  try {
    if (reachedTarget || isLast) {
      await fb.update(fb.ref(db, 'whosthat/' + currentCode), { phase: 'end', won: reachedTarget });
    } else {
      await fb.update(fb.ref(db, 'whosthat/' + currentCode), { phase: 'question', qIndex: s.qIndex + 1, answers: {} });
    }
  } catch (err) { toast(t().sendFailed); }
}

// ── END ──
function renderEnd(s) {
  const L = t();
  const won = !!s.won;
  document.getElementById('end-emoji').textContent = won ? '🎉' : '🙌';
  const title = document.getElementById('end-title');
  title.textContent = won ? L.winTitle : L.loseTitle;
  title.style.color = won ? 'var(--wt-green)' : 'var(--brand-yellow)';
  document.getElementById('end-sub').textContent = won ? L.winSub : L.loseSub;
  document.getElementById('btn-play-again').textContent = L.playAgain;
  document.getElementById('btn-back-home').textContent = L.backHome;
}

// ═══════════════════════════════════════════════════════════════
//  HOST / PLAYER ACTIONS
// ═══════════════════════════════════════════════════════════════
async function startGame() {
  if (!isHost || !gameState) return;
  const players = playersArray(gameState);
  if (players.length < 2) { toast(t().sendFailed); return; }
  try {
    await fb.update(fb.ref(db, 'whosthat/' + currentCode), { phase: 'question', qIndex: 0, score: 0, answers: {} });
  } catch (err) { toast(t().sendFailed); }
}
async function playAgain() {
  if (!gameState) return;
  if (!isHost) { toast(t().sendFailed); return; }
  const fresh = freshQuestions(gameState.qCount);
  try {
    await fb.update(fb.ref(db, 'whosthat/' + currentCode), {
      phase: 'lobby', qIndex: 0, score: 0, answers: {},
      qIdx: fresh, won: null, lastUnanimous: null, lastPickedId: null, targetHit: null
    });
  } catch (err) { toast(t().sendFailed); }
}
async function leaveGame() {
  try { if (presenceRef) presenceRef.onDisconnect().cancel(); } catch (e) {}
  try {
    if (gameRef && myId) {
      if (isHost) await fb.remove(gameRef);
      else await fb.remove(fb.ref(db, `whosthat/${currentCode}/players/${myId}`));
    }
  } catch (err) {}
  cleanup();
  showView('landing-view');
}
function backFromGame() { leaveGame(); }

// ═══════════════════════════════════════════════════════════════
//  EVENT WIRING
// ═══════════════════════════════════════════════════════════════
document.getElementById('lv-back').addEventListener('click', exitLanding);
document.getElementById('cv-back').addEventListener('click', () => showView('landing-view'));
document.getElementById('jv-back').addEventListener('click', () => showView('landing-view'));
document.getElementById('lov-back').addEventListener('click', leaveGame);
document.getElementById('qv-back').addEventListener('click', leaveGame);
document.getElementById('rv-back').addEventListener('click', leaveGame);
document.getElementById('ev-back').addEventListener('click', leaveGame);

['lv','cv','jv','lov','qv','rv','ev'].forEach(p => {
  document.getElementById(p + '-sound').addEventListener('click', toggleSound);
  document.getElementById(p + '-help').addEventListener('click', openHow);
  document.getElementById(p + '-lb-en').addEventListener('click', () => setLang('en'));
  document.getElementById(p + '-lb-hi').addEventListener('click', () => setLang('hi'));
});

document.getElementById('card-create').addEventListener('click', goCreate);
document.getElementById('card-join').addEventListener('click', goJoin);
document.getElementById('btn-create-go').addEventListener('click', createGame);
document.getElementById('btn-join-go').addEventListener('click', joinGame);
document.getElementById('in-qcount-row').addEventListener('click', openPicker);
document.getElementById('target-minus').addEventListener('click', () => bumpTarget(-1));
document.getElementById('target-plus').addEventListener('click', () => bumpTarget(1));
document.getElementById('btn-copy').addEventListener('click', copyCode);
document.getElementById('btn-play-again').addEventListener('click', playAgain);
document.getElementById('btn-back-home').addEventListener('click', backFromGame);

document.getElementById('picker-overlay').addEventListener('click', (e) => { if (e.target.id === 'picker-overlay') closePicker(); });
document.getElementById('how-overlay').addEventListener('click', (e) => { if (e.target.id === 'how-overlay') closeHow(); });

document.getElementById('in-code').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});
document.getElementById('in-host').addEventListener('keydown', e => { if (e.key === 'Enter') createGame(); });
document.getElementById('in-name').addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });
document.getElementById('in-code').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('in-name').focus(); });

window.addEventListener('beforeunload', e => {
  if (gameRef && gameState && gameState.phase !== 'lobby') { e.preventDefault(); e.returnValue = ''; }
});

// ═══════════════════════════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════════════════════════
updateSoundButtons();
applyLang();
updateStepperButtons();
if (CONFIGURED) {
  waitForFirebase().then(ok => { if (!ok) console.warn("Who's That?: Firebase SDK unavailable."); });
}
</script>
