<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1a3d">
<title>Mil ke Khelo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   DESIGN TOKENS (from Figma)
   ───────────────────────────────────────────── */
:root {
  --background-screen:#0f1a3d;
  --background-surface:#16234a;
  --border-default:#3a4a7a;
  --brand-blue:#2e6bf2;
  --text-primary:#ffffff;
  --text-muted:#a9b4d6;

  --space-4:4px;
  --space-8:8px;
  --space-12:12px;
  --space-16:16px;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-xl:24px;

  /* module gradients (top light → bottom dark) + shadow */
  --pink-light:#ff93b3;   --pink-dark:#cc2f63;   --pink-shadow:#701a36;
  --green-light:#6ee0ac;  --green-dark:#1e8a5c;  --green-shadow:#114c33;
  --purple-light:#c3b0f5; --purple-dark:#6a4fc2; --purple-shadow:#3a2b6b;
  --coral-light:#ffa57d;  --coral-dark:#cc4e1e;  --coral-shadow:#702b11;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  background:var(--background-screen);
  font-family:'Baloo 2', sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
}

/* ─────────────────────────────────────────────
   CANVAS — 360×720 design, scaled responsively
   ───────────────────────────────────────────── */
.home {
  position:relative;
  width:360px;
  height:720px;
  margin:0 auto;
  background:var(--background-screen);
  overflow:hidden;
}
/* On real phones, scale the 360-wide canvas up to fill width */
@media (max-width:520px) {
  .home {
    width:100vw;
    min-height:100vh;
    min-height:100dvh;
    height:auto;
  }
}

/* ── HEADER (node 6:140) — flex, 12px padding, full width ── */
.header {
  position:absolute; top:0; left:0;
  width:100%; height:56px;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px;
  z-index:10;
}

/* Icon/Menu (6:114) — 32px chip, 3 bars */
.icon-menu {
  width:32px; height:32px;
  background:var(--background-surface);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:3px;
  cursor:pointer; flex-shrink:0;
}
.icon-menu .bar {
  width:16px; height:3px; border-radius:1.5px;
  background:var(--text-primary);
}

/* Language Toggle (6:124) — 72×32 pill, two segments */
.lang-toggle {
  width:72px; height:32px;
  background:var(--background-surface);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center;
  padding:var(--space-4);
  flex-shrink:0; cursor:pointer;
}
.lang-seg {
  flex:1 0 0; height:100%; min-width:0;
  display:flex; align-items:center; justify-content:center;
  padding:0 var(--space-4);
  border-radius:var(--radius-sm);
  font-weight:700; font-size:15px;
  overflow:hidden;
}
.lang-seg.active {
  background:var(--brand-blue);
  color:var(--text-primary);
}
.lang-seg.inactive {
  background:transparent;
  color:var(--text-muted);
}

/* ── LOGO WITH TAGLINE (6:97) — top:156, centered, 240px ── */
.logo-lockup {
  position:absolute; top:156px; left:50%;
  transform:translateX(-50%);
  width:240px;
  display:flex; flex-direction:column;
  align-items:center; gap:6px;
}
.logo-wordmark {
  width:240px; max-width:calc(100% - 32px); height:auto;
  object-fit:contain;
  display:block;
}
.logo-divider {
  width:146px; height:10px;
  display:flex; align-items:center; justify-content:center;
}
.logo-divider svg { display:block; width:146px; height:10px; }
.logo-tagline {
  width:240px;
  font-weight:600; font-size:12px;
  text-align:center; color:#ffffff;
  line-height:normal;
}

/* ── GAME CARD GRID (6:160) — left:20, top:308, 320px ── */
.card-grid {
  position:absolute; top:308px; left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:328px;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  column-gap:16px; row-gap:22px;
}
.game-card {
  height:148px;
  border-radius:var(--radius-xl);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:var(--space-8);
  padding-top:var(--space-16);
  padding-bottom:var(--space-12);
  cursor:pointer;
  position:relative;
  transition:transform .1s;
}
.game-card:active { transform:translateY(3px); }
.game-card .icon {
  width:92px; height:92px;
  object-fit:contain;
  pointer-events:none; user-select:none;
}
.game-card .label {
  font-weight:800; font-size:16px;
  line-height:1.25; text-align:center;
  color:var(--text-primary);
  width:min-content; min-width:100%;
}

/* Per-colour gradient + 6px solid drop-shadow (chunky 3D) */
.card-pink {
  background:linear-gradient(to bottom, var(--pink-light), var(--pink-dark));
  box-shadow:0 6px 0 0 var(--pink-shadow);
}
.card-green {
  background:linear-gradient(to bottom, var(--green-light), var(--green-dark));
  box-shadow:0 6px 0 0 var(--green-shadow);
}
.card-purple {
  background:linear-gradient(to bottom, var(--purple-light), var(--purple-dark));
  box-shadow:0 6px 0 0 var(--purple-shadow);
}
.card-coral {
  background:linear-gradient(to bottom, var(--coral-light), var(--coral-dark));
  box-shadow:0 6px 0 0 var(--coral-shadow);
}

/* ── BOTTOM BAR (6:165) — 360×50, navy surface ── */
.bottom-bar {
  position:absolute; bottom:0; left:50%;
  transform:translateX(-50%);
  width:360px; height:50px;
  background:var(--background-surface);
}
@media (max-width:520px) {
  .bottom-bar {
    position:fixed; left:0; transform:none;
    width:100%;
    height:calc(50px + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
}
</style>
</head>
<body>

<div class="home">

  <!-- HEADER -->
  <div class="header">
    <div class="icon-menu" aria-label="Menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="lang-toggle" aria-label="Language">
      <div class="lang-seg active">EN</div>
      <div class="lang-seg inactive">हिं</div>
    </div>
  </div>

  <!-- LOGO + TAGLINE -->
  <div class="logo-lockup">
    <img src="logo-wordmark-new.png" class="logo-wordmark" alt="milkekhelo.com">
    <div class="logo-divider">
      <svg viewBox="0 0 146 10" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="5" x2="63" y2="5" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
        <path d="M73 8 C 70.5 6, 68.5 4.6, 68.5 2.9 C 68.5 1.7, 69.5 1, 70.6 1 C 71.5 1, 72.3 1.5, 73 2.4 C 73.7 1.5, 74.5 1, 75.4 1 C 76.5 1, 77.5 1.7, 77.5 2.9 C 77.5 4.6, 75.5 6, 73 8 Z" fill="#ffffff"/>
        <line x1="83" y1="5" x2="146" y2="5" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      </svg>
    </div>
    <div class="logo-tagline">Less Scrolling. More Stories.</div>
  </div>

  <!-- GAME CARDS (2×2) -->
  <div class="card-grid">
    <div class="game-card card-pink">
      <img src="sns-home.png" class="icon" alt="">
      <div class="label">Steps &amp; Slides</div>
    </div>
    <div class="game-card card-green">
      <img src="memorygrid-home.png" class="icon" alt="">
      <div class="label">Memory Grid</div>
    </div>
    <div class="game-card card-purple">
      <img src="first-home.png" class="icon" alt="">
      <div class="label">My First</div>
    </div>
    <div class="game-card card-coral">
      <img src="thankyou-home.png" class="icon" alt="">
      <div class="label">Thank You</div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar"></div>

</div>

</body>
</html>
